# Dependabot's pull requests: the Go modules and the actions, a grouped pull request of each a
# month, of versions out a week at least, headed build: and ci:. Each runs CI with Dependabot's
# own secrets, DENYLIST among them (docs/maintaining.md).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      go:
        patterns: ["*"]
    commit-message:
      prefix: build
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    # Dependabot would move the hashes of the toolkit's actions, each named by its path, but not
    # the marketplace's ref in .claude/settings.json, which it does not read. The toolkit's
    # tools/pin moves both to one release (docs/maintaining.md).
    ignore:
      - dependency-name: "zadykian/toolkit*"
    commit-message:
      prefix: ci
