# The form of an issue that asks for a change. GitHub reads it; nothing private goes in an issue.
name: Change
description: A feature, or a change of behaviour, to talk over before its pull request.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >-
        Make up each value you give, as the tests do, from documentation ranges and example.test.
  - type: checkboxes
    id: private
    attributes:
      label: Nothing private
      options:
        - label: >-
            This issue holds no profile, key, certificate or password, and no employer's names,
            hosts, addresses or domains.
          required: true
  - type: textarea
    id: today
    attributes:
      label: Today
      description: What ikeward does today, and what is missing or wrong with it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change, and the options you passed over.
    validations:
      required: true
