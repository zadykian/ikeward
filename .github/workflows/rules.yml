name: rules

# A pull request's commits, size, title and description, and the vague names and filler it adds,
# against the rules of zadykian/toolkit's skills: its three checks, with their default inputs.
# Each warns, in a comment on the pull request, and never blocks, so no ruleset requires the job.
# They read the pull request through GitHub's API and check out nothing.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

# Two runs of a pull request race to create each check's comment, so a newer event's run cancels
# the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
      contents: read
      pull-requests: write
    steps:
      - uses: zadykian/toolkit/actions/atomic-commits@856200e2c82d60a5dcbe91ee0bb0e9cfdcb89e71 # v6.4.0
      - uses: zadykian/toolkit/actions/pr-description@856200e2c82d60a5dcbe91ee0bb0e9cfdcb89e71 # v6.4.0
      - uses: zadykian/toolkit/actions/banned-terms@856200e2c82d60a5dcbe91ee0bb0e9cfdcb89e71 # v6.4.0
