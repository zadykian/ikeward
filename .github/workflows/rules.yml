name: rules

# A pull request's commits, size, title and description, and the vague names and filler it adds,
# against the rules of zadykian/toolkit's skills: its three checks, with their default inputs.
# Each warns, in a comment on the pull request, and never blocks, so no ruleset requires the job.
# They read the pull request through GitHub's API and check out nothing.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: zadykian/toolkit/actions/atomic-commits@1c81dbd8565990dc39712e300280230464bedec8 # v4.0.1
      - uses: zadykian/toolkit/actions/pr-description@1c81dbd8565990dc39712e300280230464bedec8 # v4.0.1
      - uses: zadykian/toolkit/actions/banned-terms@1c81dbd8565990dc39712e300280230464bedec8 # v4.0.1
