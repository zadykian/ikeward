name: rules

# A pull request's commits, size, title and description, and the vague names and filler it adds,
# against the rules of zadykian/skills: the three checks of zadykian/actions, with their default
# inputs. Each warns, in a comment on the pull request, and never blocks, so no ruleset requires
# the job. They read the pull request through GitHub's API and check out nothing.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: zadykian/actions/atomic-commits@9c02fe599a7f620e98cd3d89ba9a0858e2f8b147 # v2.0.0
      - uses: zadykian/actions/pr-description@9c02fe599a7f620e98cd3d89ba9a0858e2f8b147 # v2.0.0
      - uses: zadykian/actions/banned-terms@9c02fe599a7f620e98cd3d89ba9a0858e2f8b147 # v2.0.0
