name: fast-forward

# Pull requests land on main by fast-forward, as the very commits their checks ran on. A comment
# `/ff` on a pull request into main, from someone who can push here, pushes its head commit to
# main, closes its linked issues and deletes its branch. The ff action of zadykian/toolkit says
# how, and which settings it relies on: https://github.com/zadykian/toolkit/tree/main/actions/ff.
# A pull request that changes .github/workflows is pushed by hand, `git push origin SHA:main`, as
# the workflow's token may not push it.
#
# The job starts only for a comment on a pull request that starts `/ff`, as the action's README
# sets it. The action checks the comment again, and refuses a commenter who cannot push.

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  fast-forward:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/ff')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: zadykian/toolkit/actions/ff@4c0c6dcb16a67dd4ab7346a8214e93c076dd1402 # v4.0.0
