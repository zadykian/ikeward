# The VPN server, as the connection that ikeward install writes expects it: IKEv2, logins by
# certificates from the test CA, the profile's proposals, an address for the client from a pool,
# and the remote network's ranges through the tunnel.
connections {
    remote {
        version   = 2
        proposals = aes256-sha256-modp2048
        pools     = remote

        local {
            auth  = pubkey
            certs = server-cert.pem
            id    = vpn.example.org
        }
        remote {
            auth    = pubkey
            cacerts = ca.pem
        }

        children {
            remote {
                # The ranges it grants, to which it narrows the client's 0.0.0.0/0: the
                # remote network, and a second range.
                local_ts      = 192.0.2.0/24, 198.18.0.0/24
                esp_proposals = aes128gcm16
            }
        }
    }
}

pools {
    remote {
        addrs = 203.0.113.0/24
        # A VPN server pushes its resolver too, which the client's resolve plugin, off with
        # ikeward's drop-in, would make the resolver of every name.
        dns   = 192.0.2.10
    }
}
