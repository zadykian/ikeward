# The test server's charon, which runs without systemd: it logs to stderr, which compose keeps,
# and loads its connection and credentials as it starts, as strongswan.service has swanctl do.
charon-systemd {
    filelog {
        stderr {
            default = 1
            ike_name = yes
        }
    }
}

charon {
    start-scripts {
        swanctl = /usr/sbin/swanctl --load-all --noprompt
    }
}
